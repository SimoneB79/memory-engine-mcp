services:
  memory-engine:
    image: ghcr.io/simoneb79/memory-engine-mcp:1.7.0
    # For local development, replace with:
    # build: .
    container_name: memory-engine
    restart: unless-stopped
    ports:
      - "8085:8085"
      - "8091:8091"
    volumes:
      # Persistent SQLite storage
      - memory-data:/data
      # Read-only access to workspace memory (markdown import)
      # Update this path to match your workspace
      - ./memory:/workspace/memory:ro
    environment:
      - MEMORY_DB_PATH=/data/memory.db
      - MARKDOWN_SOURCE=/workspace/memory
      - MEMORY_PORT=8085
      - MEM_UI_PORT=8091
      # Optional: enable auth
      # - MEMORY_API_TOKEN=your-secret-token
    networks:
      - default

volumes:
  memory-data:
