version: "3.8"

services:
  memory-engine:
    build: .
    container_name: memory-engine
    restart: unless-stopped
    ports:
      - "8085:8085"
      - "8091:8091"
    volumes:
      # Persistent SQLite storage
      - memory-data:/data
      # Read-only access to workspace memory (markdown import)
      - /home/sb/openclaw/workspace/memory:/workspace/memory:ro
    environment:
      - MEMORY_DB_PATH=/data/memory.db
      - MARKDOWN_SOURCE=/workspace/memory
      - MEMORY_HOST=0.0.0.0
      - MEMORY_PORT=8085
      - MEM_UI_PORT=8091
    networks:
      - proxy

volumes:
  memory-data:

networks:
  proxy:
    external: true
